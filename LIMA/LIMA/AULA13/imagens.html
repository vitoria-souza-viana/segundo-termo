<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revisão imagens e vídeos</title>
    <link rel="stylesheet" href="imagens.css">
</head>
<body>
    <h1>Trabalhando com imagens </h1>
    <h2>Imagem responsiva básica </h2>
    <figure class="resp-bas">
        <img src="https://i.pinimg.com/736x/5e/db/2b/5edb2b73a6f6925d59dc4524833db7a9.jpg" alt="Imagem 1">
    </figure>

    <h2>Imagem com recorte</h2>
    <figure class="img-rec">
        <img src="https://i.pinimg.com/736x/64/90/8f/64908f8b02ca933e7d9361eed804e004.jpg" alt="imagem 2">
    </figure>

    <h2>Imagens em formato de cards</h2>
    <figure class="img-card">
        <img src="https://i.pinimg.com/736x/5e/37/d5/5e37d515d4a8d571b7a853128f2a6e87.jpg" alt="imagem 3">
    </figure>
    <h2> Personalização</h2>

    <figure class="pers-img">
        <img src="https://i.pinimg.com/1200x/01/ea/15/01ea1535c1d599077825769163bc4aec.jpg" alt="Imagem 4">
    </figure>

    <h2> Imagens em grid</h2>
    <section class="sec-grid">
        <article class="img-grid">
        <img src="https://i.pinimg.com/736x/0b/dd/46/0bdd46413f5d386d8e3268ab2628d109.jpg" alt="Imagem 6">
    </article>
        <article class="img-grid">
        <img src="https://i.pinimg.com/1200x/f8/3a/0e/f83a0e5004775c2f91167f1a77fe129b.jpg" alt="Imagem 7">
    </article>
        <article class="img-grid">
        <img src="https://i.pinimg.com/736x/27/cd/de/27cdde83f7a6ba44a0be02ab98c5cad7.jpg" alt="Imagem 8">
    </article>
    </section>
<section class="video">
